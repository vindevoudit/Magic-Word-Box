# Render blueprint. Static site: CDN-served, no spin-down, no cold start.
#
# Everything the site does - tokenizing, training, inference - runs in the
# visitor's browser, so there is no server to keep warm and nothing to scale.
services:
  - type: web
    runtime: static
    name: magic-word-box
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
